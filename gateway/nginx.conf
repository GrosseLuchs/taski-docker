server {
  listen 80;

  resolver 127.0.0.11 valid=30s;

  location /api/ {
    proxy_set_header Host $http_host;
    set $backend_host backend;
    proxy_pass http://$backend_host:8000;
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location /admin/ {
    proxy_set_header Host $http_host;
    set $backend_host backend;
    proxy_pass http://$backend_host:8000;
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location / {
    alias /staticfiles/;
    index index.html;
  }
}